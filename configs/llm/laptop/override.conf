[Service]
# Force Ollama to use Vulkan compute backend
Environment="OLLAMA_VULKAN=1"

# Map exclusively to the first Vulkan device (Radeon 780M)
Environment="OLLAMA_VULKAN_DEVICE=0"

# Enable integrated GPU support (forces allocation on UMA shared system memory)
Environment="OLLAMA_INTEGRATED_GPU=1"

# Disable Flash Attention on RDNA3 iGPU to prevent shader freezes
Environment="OLLAMA_FLASH_ATTENTION=0"

# Network binding
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_ORIGINS=*"
